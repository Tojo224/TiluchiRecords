x-ai-environment: &ai-environment
  REDIS_HOST: redis
  REDIS_PORT: 6379
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME:-tiluchi-media}
  MODEL_CACHE_DIR: /models
  HF_HOME: /models/huggingface
  TORCH_HOME: /models/torch
  HF_TOKEN: ${HF_TOKEN:-}
  DEMUCS_MODEL: ${DEMUCS_MODEL:-htdemucs}
  DEMUCS_DEVICE: ${DEMUCS_DEVICE:-auto}
  WHISPER_MODEL: ${WHISPER_MODEL:-small}
  WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
  WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
  FACEFUSION_PATH: /opt/facefusion
  FACEFUSION_EXECUTION_PROVIDER: ${FACEFUSION_EXECUTION_PROVIDER:-auto}
  FACEFUSION_MODEL: ${FACEFUSION_MODEL:-inswapper_128_fp16}
  DIFFUSION_MODEL: ${DIFFUSION_MODEL:-stable-diffusion-v1-5/stable-diffusion-v1-5}
  DIFFUSION_DEVICE: ${DIFFUSION_DEVICE:-auto}
  DIFFUSION_STEPS: ${DIFFUSION_STEPS:-25}
  DIFFUSION_WIDTH: ${DIFFUSION_WIDTH:-768}
  DIFFUSION_HEIGHT: ${DIFFUSION_HEIGHT:-432}
  VIDEO_DIFFUSION_MODEL: ${VIDEO_DIFFUSION_MODEL:-stabilityai/stable-video-diffusion-img2vid-xt}
  VIDEO_DIFFUSION_FRAMES: ${VIDEO_DIFFUSION_FRAMES:-14}
  VIDEO_DIFFUSION_STEPS: ${VIDEO_DIFFUSION_STEPS:-12}
  VIDEO_DIFFUSION_DECODE_CHUNK: ${VIDEO_DIFFUSION_DECODE_CHUNK:-2}
  VIDEO_SEGMENT_SECONDS: ${VIDEO_SEGMENT_SECONDS:-10}
  VIDEO_MAX_SEGMENTS: ${VIDEO_MAX_SEGMENTS:-1}

x-ai-volumes: &ai-volumes
  - ai_models:/models
  - facefusion_models:/opt/facefusion/.assets

services:
  postgres:
    image: postgres:16-alpine
    container_name: tiluchi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-tiluchirecords_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tiluchirecords_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tiluchi-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: bitnamilegacy/minio:2025.4.22
    container_name: tiluchi-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET_NAME:-tiluchi-media}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/bitnami/minio/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tiluchi-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/${POSTGRES_DB:-tiluchirecords_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-tiluchi-media}
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_FORCE_PATH_STYLE: "true"
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_in_production_min_32_chars}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      JOB_STALE_TIMEOUT_MS: ${JOB_STALE_TIMEOUT_MS:-600000}
      JOB_WATCHDOG_INTERVAL_MS: ${JOB_WATCHDOG_INTERVAL_MS:-30000}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: tiluchi-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  ai-worker:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: tiluchi-ai-worker
    restart: unless-stopped
    gpus: all
    environment: *ai-environment
    volumes: *ai-volumes
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  ai-models-init:
    profiles: ["models"]
    build:
      context: ./ai
      dockerfile: Dockerfile
    environment: *ai-environment
    volumes: *ai-volumes
    command: ["python", "scripts/download_models.py", "all"]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ai_models:
  facefusion_models:

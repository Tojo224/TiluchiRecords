services:
  ai-worker:
    build:
      context: ../../ai
    gpus: all
    environment:
      REDIS_HOST: host.docker.internal
      REDIS_PORT: 16379
      S3_ENDPOINT: http://host.docker.internal:19000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      S3_BUCKET_NAME: tiluchi-media
      MODEL_CACHE_DIR: /models
      HF_HOME: /models/huggingface
      TORCH_HOME: /models/torch
      FACEFUSION_PATH: /opt/facefusion
      FACE_SWAP_PASS_TIMEOUT_SECONDS: 1800
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      VIDEO_MAX_SEGMENTS: 1
    volumes:
      - D:/paquetes/tiluchirecords-ai-models:/models
      - D:/paquetes/tiluchirecords-ai-models/facefusion:/opt/facefusion/.assets

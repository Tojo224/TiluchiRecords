services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tiluchi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: tiluchirecords
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiluchi -d tiluchirecords"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: bitnamilegacy/minio:2025.4.22
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      MINIO_DEFAULT_BUCKETS: tiluchi-media
      MINIO_API_CORS_ALLOW_ORIGIN: https://tiluchirecords.bshadow.xyz
    ports:
      - "127.0.0.1:19000:9000"
    volumes:
      - minio_data:/bitnami/minio/data

  backend:
    build:
      context: ../../backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://tiluchi:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/tiluchirecords?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: https://media-tiluchirecords.bshadow.xyz
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      S3_BUCKET_NAME: tiluchi-media
      S3_FORCE_PATH_STYLE: "true"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      CORS_ORIGIN: https://tiluchirecords.bshadow.xyz
      JOB_STALE_TIMEOUT_MS: 600000
      JOB_WATCHDOG_INTERVAL_MS: 30000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  web:
    build:
      context: ../../web
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
